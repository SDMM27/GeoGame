name: EAS Update

# Publishes an over-the-air update of the app (EAS Update) from GitHub, without a local build:
#  - automatically to both channels after each merge on master that changes the app (mobile/) or the code it shares
#    with the website (src/): preview for the APKs of GeoGame-releases, production for the Play Store builds;
#  - by hand from the Actions tab → "EAS Update" → Run workflow, choosing the branch and the channel.
# An installed APK only receives the updates made for its native runtime version (the fingerprint of its native code,
# see runtimeVersion in mobile/app.json). When a change alters it (a native module added or upgraded, a config plugin…),
# no APK can receive the update: the apk job then builds one and publishes it as the latest release of
# GeoGame-releases, where the website's download link and the app's "new version" banner point. Google Play
# builds and submissions are queued by the dependent store job only if no compatible native runtime exists.
# Needs the repository secrets EXPO_TOKEN (expo.dev → Account settings → Access tokens) and RELEASES_TOKEN (a GitHub
# fine-grained token with Contents: read and write on SDMM27/GeoGame-releases).
on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-update.yml'
      - '.github/workflows/play-store.yml'
      - '!**/*.test.*'
      - '!**/*.spec.*'
      - '!**/__tests__/**'
      - '!**/__mocks__/**'
      - '!**/docs/**'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel (preview for the installed APKs, production for the store builds)
        required: true
        default: both
        type: choice
        options: [both, preview, production]
      message:
        description: Update message
        required: true
        type: string

permissions:
  contents: read

# Two merges in a row: the second update waits for the first instead of racing it (and never builds the same APK twice).
concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish the update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    outputs:
      # The runtime of the preview update, empty when only production was published
      preview_runtime: ${{ steps.publish.outputs.preview_runtime }}
      # Empty for a preview-only dispatch, so the store workflow is skipped.
      production_runtime: ${{ steps.publish.outputs.production_runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # The EAS environment of the same name provides the EXPO_PUBLIC_* variables, as when run locally.
      # One update per channel, each built with its own EAS environment.
      - id: publish
        run: |
          if [ "$CHANNELS" = both ]; then CHANNELS="preview production"; fi
          for channel in $CHANNELS; do
            eas update --channel "$channel" --environment "$channel" --message "$MESSAGE" --json > "update-$channel.json"
            cat "update-$channel.json"
            runtime=$(jq -er 'map(select(.platform == "android"))[0].runtimeVersion | select(type == "string" and length > 0 and . != "null")' "update-$channel.json")
            if [ "$channel" = preview ]; then echo "preview_runtime=$runtime" >> "$GITHUB_OUTPUT"; fi
            if [ "$channel" = production ]; then
              echo "production_runtime=$runtime" >> "$GITHUB_OUTPUT"
              echo "::notice::Production OTA published for native runtime $runtime. The dependent store job checks whether a native build is needed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          done
        env:
          # After a merge there are no inputs: both channels, and the merge's commit message.
          CHANNELS: ${{ inputs.channel || 'both' }}
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}

  store:
    name: Check and release the production native runtime
    needs: update
    if: needs.update.outputs.production_runtime != ''
    uses: ./.github/workflows/play-store.yml
    with:
      runtime: ${{ needs.update.outputs.production_runtime }}
    secrets: inherit

  apk:
    name: Build an APK if the native runtime changed
    needs: update
    if: needs.update.outputs.preview_runtime != ''
    runs-on: ubuntu-latest
    # The build runs on EAS servers and can wait a long time in the free queue.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Even listing the builds (below) reads the app config, whose plugins come from node_modules.
      - run: npm ci
      - name: Publish an APK for this runtime on GeoGame-releases, unless the latest release already is one
        run: |
          # Checked first: without it the release fails only after the APK build, which can take an hour.
          if [ -z "$GH_TOKEN" ]; then echo "::error::The RELEASES_TOKEN repository secret is missing (see the top of this file)"; exit 1; fi
          released=$(curl -sSfL https://github.com/SDMM27/GeoGame-releases/releases/latest/download/latest.json | jq -r .runtimeVersion || true)
          if [ "$released" = "$RUNTIME" ]; then echo "The latest release is already built for runtime $RUNTIME"; exit 0; fi
          # An APK already built for this runtime (by hand, say) is reused; otherwise one is built on EAS servers.
          eas build:list --platform android --build-profile preview --runtime-version "$RUNTIME" --status finished --limit 1 --json > build.json
          if [ "$(jq length build.json)" -eq 0 ]; then
            eas build --platform android --profile preview --non-interactive --wait --json > build.json
          fi
          cat build.json
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          version=$(jq -r '.[0].appVersion' build.json)
          runtime=$(jq -r ".[0].runtime.version // .[0].runtimeVersion // \"$RUNTIME\"" build.json)
          curl -sSfL "$url" -o geogame.apk
          # Read by the app (useNewerApk in mobile/src/updates.ts) to tell an APK that no update can reach any more.
          jq -n --arg runtime "$runtime" --arg version "$version" '{runtimeVersion: $runtime, appVersion: $version}' > latest.json
          gh release create "v$version-${runtime:0:7}" geogame.apk latest.json --repo SDMM27/GeoGame-releases \
            --title "GeoGame $version (${runtime:0:7})" --notes "$MESSAGE" --latest
        env:
          RUNTIME: ${{ needs.update.outputs.preview_runtime }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
