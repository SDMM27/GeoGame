name: EAS Update

# Publishes an over-the-air update of the app (EAS Update) from GitHub, without a local build:
#  - automatically to the preview channel after each merge on master that changes the app (mobile/) or the code it
#    shares with the website (src/);
#  - by hand from the Actions tab → "EAS Update" → Run workflow, choosing the branch and the channel.
# Needs the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens).
on:
  push:
    branches: [master]
    paths: ['mobile/**', 'src/**', '!src/**/*.test.js', '!mobile/**/*.test.ts', '!mobile/**/*.test.tsx', '!mobile/README.md']
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel (preview for the installed APKs, production for the store builds)
        required: true
        default: preview
        type: choice
        options: [preview, production]
      message:
        description: Update message
        required: true
        type: string

permissions:
  contents: read

# Two merges in a row: the second update waits for the first instead of racing it.
concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish the update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # The EAS environment of the same name provides the EXPO_PUBLIC_* variables, as when run locally.
      - run: eas update --channel "$CHANNEL" --environment "$CHANNEL" --message "$MESSAGE" --non-interactive
        env:
          # After a merge there are no inputs: preview channel, and the merge's commit message.
          CHANNEL: ${{ inputs.channel || 'preview' }}
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
