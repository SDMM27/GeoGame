name: Google Play Release

# Every app change queues a build and submission, independently of OTA updates or native runtime.
# EAS uses remote Android credentials and the profiles in mobile/eas.json.
on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/play-store.yml'
      - '!**/*.test.*'
      - '!**/*.spec.*'
      - '!**/__tests__/**'
      - '!**/__mocks__/**'
      - '!**/docs/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-store-production
  cancel-in-progress: false

jobs:
  production:
    name: Queue Google Play (${{ matrix.submit_profile }})
    runs-on: ubuntu-latest
    # Each track gets its own build and version code. EAS owns the queued build and submission.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        submit_profile: ${{ fromJSON(vars.PLAY_PRODUCTION_ENABLED == 'true' && '["play-internal","production"]' || '["play-internal"]') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Queue a build with automatic submission
        id: build
        env:
          SUBMIT_PROFILE: ${{ matrix.submit_profile }}
        run: |
          eas build --platform android --profile production --auto-submit-with-profile "$SUBMIT_PROFILE" --non-interactive --no-wait --json > build.json
          cat build.json
          jq -e 'type == "array" and length == 1' build.json > /dev/null
          build_id=$(jq -er '.[0].id | select(type == "string") | select(test("^[A-Za-z0-9-]+$"))' build.json)
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          {
            echo '## Google Play Release'
            echo "Android build + submission queued on EAS using submit profile: $SUBMIT_PROFILE."
            echo 'Public production is queued only when PLAY_PRODUCTION_ENABLED is true, as a separately versioned build from the same source commit.'
            echo 'Availability remains subject to successful submission and any required Google review; this workflow does not confirm user-facing publication.'
            echo "Build ID: $build_id"
            echo "[EAS build](https://expo.dev/accounts/sdmm27/projects/geogame/builds/$build_id)"
          } >> "$GITHUB_STEP_SUMMARY"
