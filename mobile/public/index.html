<!DOCTYPE html>
<!-- Web build template (expo export -p web). Makes the app installable from Safari/Chrome
     ("Add to Home Screen"): full screen and own icon. The status bar is opaque so screens always
     start below the iPhone camera (safe-area insets sometimes read 0 on first load). -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="GeoGame — Mini-jeux de géographie" />
    <meta name="theme-color" content="#0B1020" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebaseappcheck.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="GeoGame" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0B1020;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* No text selection outside the fields, like in a native app. On iPhone a tap held a bit too
         long selects the word under the finger, and react-native-web then cancels the press: the
         button does nothing. */
      #root * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #root input,
      #root textarea {
        -webkit-user-select: text;
        user-select: text;
        /* Pinch zoom stays allowed (accessibility); 16px keeps iOS Safari from zooming in on focus. */
        font-size: max(16px, 1em) !important;
      }
    </style>
    <script>
      // Like KeyboardAvoidingView on native: when the iPhone keyboard opens, shrink the app to the
      // visible area instead of letting Safari slide the whole page up.
      ;(function () {
        var viewport = window.visualViewport
        if (!viewport) return
        function fit() {
          document.documentElement.style.height = viewport.height + 'px'
          if (window.scrollY || viewport.offsetTop) window.scrollTo(0, 0)
        }
        viewport.addEventListener('resize', fit)
        viewport.addEventListener('scroll', fit)
        fit()
      })()
    </script>
  </head>
  <body>
    <noscript>Active JavaScript pour jouer à GeoGame.</noscript>
    <div id="root"></div>
  </body>
</html>
